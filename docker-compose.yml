# CREATE FILE: docker-compose.yml

services:
  # Next.js application
  nextjs:
    build:
      context: ./inc
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - BRIDGE_URL=http://api_bridge:3001
    volumes:
      - ./inc:/app
      - /app/node_modules
    depends_on:
      - postgres
      - api_bridge
    networks:
      - inc_network

  # API Bridge
  api_bridge:
    build:
      context: ./api
    ports:
      - "3001:3001"
    environment:
      - DOCKER_ENV=true
      - PRICING_SERVICE_URL=http://pricing_service:8001
      - ROUTING_SERVICE_URL=http://routing_service:8002
      - MATCHING_SERVICE_URL=http://matching_service:8003
      - ESCROW_SERVICE_URL=http://escrow_service:8004
      - RAG_SERVICE_URL=http://rag_agent:8005
    depends_on:
      - pricing_service
      - routing_service
      - matching_service
      - escrow_service
      - rag_agent
    networks:
      - inc_network

  # Pricing Service
  pricing_service:
    build:
      context: ./services/pricing_service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    volumes:
      - ./config:/app/config:ro
    networks:
      - inc_network

  # Routing Service  
  routing_service:
    build:
      context: ./services/routing_service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    volumes:
      - ./config:/app/config:ro
    networks:
      - inc_network

  # Matching Service
  matching_service:
    build:
      context: ./services/matching_service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://inc_user:inc_password@postgres:5432/inc_logistics
    volumes:
      - ./config:/app/config:ro
    depends_on:
      - postgres
    networks:
      - inc_network

  # Escrow Service
  escrow_service:
    build:
      context: ./services/escrow_service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - USE_REAL_STRIPE=false
      - DATABASE_URL=postgresql://inc_user:inc_password@postgres:5432/inc_logistics
    depends_on:
      - postgres
    networks:
      - inc_network

  # RAG Agent Service
  rag_agent:
    build:
      context: ./services/rag_agent
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
    volumes:
      - ./config:/app/config:ro
      - ./example_data:/app/example_data:ro
    networks:
      - inc_network

  # PostgreSQL Database (PostGIS image required for geospatial operations)
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: inc_logistics
      POSTGRES_USER: inc_user
      POSTGRES_PASSWORD: inc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/00_auth_stub.sql:/docker-entrypoint-initdb.d/00_auth_stub.sql
      - ./infra/supabase/new_tables.sql:/docker-entrypoint-initdb.d/01_new_tables.sql
      - ./infra/supabase/pulse_matches.sql:/docker-entrypoint-initdb.d/02_pulse_matches.sql
      - ./infra/supabase/service_providers.sql:/docker-entrypoint-initdb.d/03_service_providers.sql
    networks:
      - inc_network

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - inc_network

volumes:
  postgres_data:

networks:
  inc_network:
    driver: bridge